<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- SealsAtHome icon: original drawing of a seal pup on an ice floe, Deep North night sky. Rendered to icon.png with cairosvg (1024 px, then LANCZOS down to 256). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1f38"/>
      <stop offset="0.65" stop-color="#1d4a6b"/>
      <stop offset="1" stop-color="#2f6f8f"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ff2c1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ff2c1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fb8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f8fb"/>
      <stop offset="1" stop-color="#b9d3e2"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#cfd6dd"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256" rx="44"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- sky -->
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- aurora -->
    <path d="M -20 70 C 40 30, 90 95, 150 55 S 250 40, 290 60 L 290 90 C 230 75, 190 105, 140 88 S 40 70, -20 105 Z"
          fill="url(#aurora)"/>
    <!-- stars / snow -->
    <g fill="#ffffff">
      <circle cx="30" cy="34" r="2" opacity="0.8"/>
      <circle cx="62" cy="20" r="1.4" opacity="0.6"/>
      <circle cx="104" cy="28" r="1.6" opacity="0.7"/>
      <circle cx="214" cy="26" r="2" opacity="0.8"/>
      <circle cx="232" cy="96" r="1.4" opacity="0.6"/>
      <circle cx="22" cy="118" r="1.6" opacity="0.6"/>
      <circle cx="176" cy="18" r="1.3" opacity="0.5"/>
    </g>
    <!-- ice floe -->
    <ellipse cx="128" cy="226" rx="150" ry="46" fill="url(#ice)"/>
    <ellipse cx="128" cy="214" rx="96" ry="14" fill="#9fbfd2" opacity="0.55"/>
  </g>

  <!-- pup -->
  <ellipse cx="128" cy="214" rx="92" ry="12" fill="#5d8aa6" opacity="0.35"/>
  <g>
    <!-- body -->
    <ellipse cx="128" cy="178" rx="82" ry="44" fill="url(#fur)" stroke="#c3ccd5" stroke-width="2"/>
    <!-- flippers -->
    <ellipse cx="62" cy="196" rx="22" ry="11" fill="#d7dde3" transform="rotate(-24 62 196)"/>
    <ellipse cx="194" cy="196" rx="22" ry="11" fill="#d7dde3" transform="rotate(24 194 196)"/>
    <!-- head -->
    <circle cx="128" cy="128" r="62" fill="url(#fur)" stroke="#c3ccd5" stroke-width="2"/>
    <!-- fluffy fur tufts on top -->
    <g fill="#ffffff">
      <circle cx="98" cy="74" r="9"/>
      <circle cx="114" cy="68" r="10"/>
      <circle cx="131" cy="66" r="10"/>
      <circle cx="148" cy="70" r="9"/>
    </g>
    <!-- cheeks -->
    <ellipse cx="88" cy="146" rx="13" ry="8" fill="#f4a9b4" opacity="0.65"/>
    <ellipse cx="168" cy="146" rx="13" ry="8" fill="#f4a9b4" opacity="0.65"/>
    <!-- eyes -->
    <ellipse cx="102" cy="124" rx="15" ry="18" fill="#15161a"/>
    <ellipse cx="154" cy="124" rx="15" ry="18" fill="#15161a"/>
    <circle cx="96" cy="116" r="6" fill="#ffffff"/>
    <circle cx="148" cy="116" r="6" fill="#ffffff"/>
    <circle cx="107" cy="131" r="2.6" fill="#ffffff" opacity="0.85"/>
    <circle cx="159" cy="131" r="2.6" fill="#ffffff" opacity="0.85"/>
    <!-- muzzle -->
    <ellipse cx="117" cy="154" rx="16" ry="12" fill="#e9edf1"/>
    <ellipse cx="139" cy="154" rx="16" ry="12" fill="#e9edf1"/>
    <g fill="#9aa4ae">
      <circle cx="110" cy="152" r="1.6"/><circle cx="117" cy="158" r="1.6"/><circle cx="108" cy="160" r="1.6"/>
      <circle cx="146" cy="152" r="1.6"/><circle cx="139" cy="158" r="1.6"/><circle cx="148" cy="160" r="1.6"/>
    </g>
    <!-- nose -->
    <path d="M 120 142 Q 128 137 136 142 Q 134 151 128 152 Q 122 151 120 142 Z" fill="#2b2224"/>
    <ellipse cx="125" cy="142.5" rx="3" ry="1.6" fill="#ffffff" opacity="0.6"/>
    <!-- mouth -->
    <path d="M 119 163 Q 124 168 128 163 Q 132 168 137 163" fill="none" stroke="#2b2224" stroke-width="2.4"
          stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#a9b4bf" stroke-width="1.8" stroke-linecap="round">
      <path d="M 100 153 L 70 148"/><path d="M 100 158 L 69 160"/>
      <path d="M 156 153 L 186 148"/><path d="M 156 158 L 187 160"/>
    </g>
  </g>

  <!-- heart -->
  <g transform="translate(196 58) rotate(14)">
    <path d="M 0 30 C -6 24, -26 12, -26 -4 C -26 -16, -16 -24, -6 -22 C -2 -21, 0 -18, 0 -16
             C 0 -18, 2 -21, 6 -22 C 16 -24, 26 -16, 26 -4 C 26 12, 6 24, 0 30 Z"
          fill="#ef4f63" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="-12" cy="-8" rx="5" ry="7" fill="#ffffff" opacity="0.55" transform="rotate(-25 -12 -8)"/>
  </g>
</svg>
